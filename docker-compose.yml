# BlockVideo development stack
#
# This compose file boots the backend and (optionally) a frontend dev server.
# It does NOT include VOICEVOX — install VOICEVOX Engine natively on the host
# because it needs GPU access for fast synthesis.
#
# Usage:
#   docker compose up backend    # FastAPI on :8000
#   docker compose up frontend   # Vite dev server on :5173
#   docker compose up            # both

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: blockvideo-backend:dev
    environment:
      STORAGE_ROOT: /data/storage
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      VOICEVOX_URL: ${VOICEVOX_URL:-http://host.docker.internal:50021}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/data/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend