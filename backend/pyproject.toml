[project]
name = "blockvideo-backend"
version = "0.1.0"
description = "BlockVideo backend — Japanese script → MP4 generator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "anyio>=4.6.0",
    "pillow>=11.0.0",
    "cairosvg>=2.7.1",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "mypy>=1.13.0",
    "ruff>=0.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"