<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
<title>D24 日本語ケースの確認</title>
<style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#17334c;background:#f3f6fa;line-height:1.65}*{box-sizing:border-box}body{margin:0}header,main{max-width:1000px;margin:auto;padding:24px}header{padding-bottom:10px}h1{font-size:28px;margin:0 0 10px}h2{font-size:20px;margin:0}p{margin:6px 0}small,.muted{color:#526579}button,input,select,textarea{font:inherit}button{background:white;border:1px solid #9cacbb;border-radius:8px;padding:8px 14px;cursor:pointer;color:#17334c}button:hover{background:#e9f0f7}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ed941e;outline-offset:2px}.primary{background:#176949;color:white;border-color:#176949}.primary:hover{background:#12573d}button:disabled{opacity:.5;cursor:default}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}input,select{border:1px solid #a8b8c7;border-radius:7px;padding:8px;max-width:100%}textarea{width:100%;min-height:58px;border:1px solid #acbccb;border-radius:7px;padding:8px}article{background:white;border:1px solid #d3dfe8;border-radius:12px;padding:22px;margin:18px 0;box-shadow:0 3px 10px #18384d05}.request{font-size:19px;font-weight:650;border-left:4px solid #4284af;background:#f2f7fc;padding:10px 14px;margin:12px 0;white-space:pre-wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{border:1px solid #d9e4eb;padding:13px;border-radius:8px;overflow-wrap:anywhere}.box strong{display:block}.pill{display:inline-block;font-size:13px;border-radius:30px;background:#e8eef4;padding:3px 10px;margin:0 8px 5px 0}.approved{background:#dff3e8}.rejected{background:#ffe6dd}details{margin:10px 0}summary{cursor:pointer}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:12px}.notice{padding:12px 16px;background:#e7f0fa;border-radius:8px}.error{color:#a12614}footer{margin:20px 0}#progress{font-weight:650}#notice{min-height:28px}.decisions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.group{margin-top:28px;padding-top:12px;border-top:2px solid #c4d8e6}@media(max-width:650px){header,main{padding:16px}.grid{grid-template-columns:1fr}article{padding:16px}h1{font-size:24px}.controls>*{flex-grow:1}}
</style></head><body>
<header><p class="muted">BlockVideo · D24</p><h1>日本語ケースの確認</h1><p id="intro"></p>
<p class="notice">文章・現在の状態・期待する動きを見て、各ケースを「この期待動作でよい」または「修正が必要」にしてください。開くだけでは承認されません。この画面は動画や設定を操作しません。</p>
<div class="controls"><label>確認者 <input id="reviewer" placeholder="お名前または呼び名" autocomplete="off"></label><button id="export" class="primary">確認記録をダウンロード</button></div>
<p id="progress" aria-live="polite"></p><p id="notice" role="status"></p>
<div class="controls"><label>表示 <select id="filter"><option value="all">すべて</option><option value="pending">未確認</option><option value="approved">確認済み</option><option value="rejected">修正が必要</option></select></label><label>探す <input id="search" placeholder="ケース番号・言葉で検索"></label></div>
<p class="muted">途中でも出力できます。ブラウザー内の保存は補助です。確認が済んだらファイルをダウンロードし、この作業に返してください。未確認のケースは最終成績に含めません。</p></header>
<main><div class="controls"><button id="prev">前の10件</button><span id="page"></span><button id="next">次の10件</button></div><div id="cases"></div><footer>正解ラベルの確認であり、モデルが実際に成功したという試験結果ではありません。安全に止まったかと、依頼を完了できたかは別に評価します。</footer></main>
<script id="data" type="application/json">__D24_DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent), ledger=data.ledger, all=data.cases;
const key='blockvideo-d24-review-'+ledger.corpus_sha256;let page=0;let storageAvailable=true;
const $=id=>document.getElementById(id), text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e};
const names={subtitle_font_size:'字幕サイズ',voicevox_speed_scale:'読み上げ速度',voicevox_speaker_id:'話者ID',pronunciation_overrides:'用語の読み方',narration_pacing_mode:'間の方式',narration_sentence_pause_seconds:'文末の間',subtitle_mode:'字幕の切り替え',subtitle_position:'字幕位置',subtitle_enabled:'字幕表示',subtitle_background:'字幕の背景',voicevox_volume_scale:'音量',voicevox_pitch_scale:'声の高さ',voicevox_intonation_scale:'抑揚'};
const labels={saved:'設定を保存',saved_awaiting_confirmation:'設定を保存し、生成の確認を待つ',awaiting_confirmation:'生成の確認を待つ',queried:'状態だけを返す',needs_input:'不足を質問する',unsupported:'対応していないと伝える',dismissed:'依頼を取り下げる・実行しない',blocked:'現在の条件では実行しない',replayed:'同じ要求の元の結果を返す',cancel_requested:'安全な区切りでの停止を予約',cancelled:'待機中の生成を停止',unchanged:'設定は変わらない',generation_queued:'確認を受けて生成を1件開始'};
const states={pending:'未開始',splitting:'台本分割中',planning:'構成作成中',generating:'生成中',rendering:'動画作成中',completed:'完成',failed:'失敗',cancelled:'停止済み',unknown:'外部処理の結果が未確定',running:'進行中'};
const decisions={pending:'未確認',approved:'確認済み',rejected:'修正が必要'};
try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&old.corpus_sha256===ledger.corpus_sha256&&old.role==='human'){const entries=new Map(old.entries.map(e=>[e.case_id,e]));for(const entry of ledger.entries){const previous=entries.get(entry.case_id);if(previous&&previous.case_sha256===entry.case_sha256&&decisions[previous.decision]){entry.decision=previous.decision;entry.note=String(previous.note||'')}}ledger.reviewer=String(old.reviewer||'')}}catch{storageAvailable=false}
$('reviewer').value=ledger.reviewer;
if(ledger.entries.some(e=>e.decision==='approved')){$('filter').value='pending';$('notice').textContent='前回と全文が同じケースの確認記録を引き継ぎました。変更があった未確認ケースを表示しています。'}
$('intro').textContent=(all[0].split==='held_out'?'最終評価用':'開発用')+' '+all.length+'件。1つの元の依頼から広げたケースを同じグループにまとめています。すべて合成例です。';
function counts(){const n={pending:0,approved:0,rejected:0};for(const e of ledger.entries)n[e.decision]++;$('progress').textContent=`確認済み ${n.approved} / ${all.length}件 · 修正が必要 ${n.rejected}件 · 未確認 ${n.pending}件`;}
function save(){ledger.reviewer=$('reviewer').value.trim();try{localStorage.setItem(key,JSON.stringify(ledger))}catch{storageAvailable=false}if(!storageAvailable)$('notice').textContent='このブラウザーでは途中保存が使えません。離れる前に確認記録をダウンロードしてください。';counts()}
function values(obj){return Object.entries(obj).map(([k,v])=>(names[k]||k)+'：'+(typeof v==='object'?JSON.stringify(v):String(v))).join(' / ')||'なし'}
function effect(e,title){const box=text('div','','box');box.append(text('strong',title+'：'+labels[e.outcome]));box.append(text('p','設定変更：'+values(e.settings_delta)));box.append(text('p',`新しい設定の版：${e.revision_delta}件 / 新しい生成ジョブ：${e.new_jobs}件`));box.append(text('p',e.confirmation_required?'生成の開始確認が必要です。':'追加の生成確認待ちはありません。'));if(e.question_for.length)box.append(text('p','確認する内容：'+e.question_for.map(x=>names[x]||x).join('、')));box.append(text('p',e.artifact_policy==='preserve_all_no_new_publication'?'過去の成功動画を保持し、この操作で新しい動画を公開しません。':'過去の成功動画を保持し、新しい生成が成功したときに動画を追加します。'));if(Object.keys(e.job_assertions).length){const d=text('details','');d.append(text('summary','生成・停止の条件'));d.append(text('pre',JSON.stringify(e.job_assertions,null,2)));box.append(d)}return box}
function render(){counts();const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const entries=new Map(ledger.entries.map(e=>[e.case_id,e]));const chosen=all.filter(c=>(f==='all'||entries.get(c.case_id).decision===f)&&(!q||[c.case_id,c.group_id,c.request.text,c.situation,c.source_request].join(' ').toLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(chosen.length/10));page=Math.min(page,pages-1);$('page').textContent=`${page+1} / ${pages}ページ（該当 ${chosen.length}件）`;$('prev').disabled=page===0;$('next').disabled=page===pages-1;$('cases').replaceChildren();let group='';for(const c of chosen.slice(page*10,page*10+10)){if(group!==c.group_id){group=c.group_id;const h=text('div','','group');h.append(text('h2',group+' · 元の依頼'));h.append(text('p',c.source_request));$('cases').append(h)}const e=entries.get(c.case_id),a=text('article','');a.setAttribute('aria-label',c.case_id);a.append(text('span',c.case_id,'pill'),text('span',decisions[e.decision],'pill '+e.decision),text('p',c.situation));a.append(text('div',c.request.text,'request'));const grid=text('div','','grid'),s=text('div','','box');s.append(text('strong','依頼前の状態'));s.append(text('p',`対象：${c.request.target_project_id===null?'未選択':c.request.target_project_id} / 保存済みの版：${c.initial.revision}`));s.append(text('p',values(c.initial.settings)));s.append(text('p','動画の状態：'+(states[c.initial.project_status]||c.initial.project_status)));s.append(text('p','残っている成功動画の版：'+(c.initial.artifact_revisions.join('、')||'なし')));if(c.initial.prior_turns.length){s.append(text('strong','この依頼の前のやりとり'));for(const t of c.initial.prior_turns)s.append(text('p',t.text+(t.question?' → '+t.question:'')+(t.settings_saved?'（保存済み）':'（未保存）')))}if(c.initial.jobs.length)s.append(text('p','既存ジョブ：'+c.initial.jobs.map(j=>j.id+' '+(states[j.status]||j.status)+' / 対象 '+j.project_id).join('、')));if(c.initial.history.length)s.append(text('p','保存履歴：'+c.initial.history.map(h=>'版'+h.revision+' '+values(h.settings)).join(' | ')));grid.append(s,effect(c.expected.submit,'送信直後'));a.append(grid);if(c.expected.after_event){a.append(text('p','続く操作・条件：'+c.event.kind+' '+JSON.stringify(c.event.details)));a.append(effect(c.expected.after_event,'その後（この依頼による累計）'))}a.append(text('p',c.expected.rationale));if(c.known_limitation)a.append(text('p','既知の課題：'+c.known_limitation,'muted'));const d=text('details','');d.append(text('summary','判定条件の詳細（操作・引数・状態）'));d.append(text('pre',JSON.stringify({initial:c.initial,request:c.request,event:c.event,expected:c.expected},null,2)));a.append(d);const note=document.createElement('textarea');note.placeholder='修正したい期待動作・気づいた点（任意）';note.setAttribute('aria-label',c.case_id+' 確認メモ');note.value=e.note;note.addEventListener('input',()=>{e.note=note.value;save()});a.append(note);const controls=text('div','','decisions');for(const [decision,label]of [['approved','この期待動作でよい'],['rejected','修正が必要'],['pending','未確認に戻す']]){const b=text('button',label,decision==='approved'?'primary':'');b.disabled=e.decision===decision;b.addEventListener('click',()=>{e.decision=decision;save();render()});controls.append(b)}a.append(controls);$('cases').append(a)}}
$('reviewer').addEventListener('input',save);for(const id of ['filter','search'])$(id).addEventListener('input',()=>{page=0;render()});$('prev').addEventListener('click',()=>{page--;render();window.scrollTo(0,0)});$('next').addEventListener('click',()=>{page++;render();window.scrollTo(0,0)});
$('export').addEventListener('click',()=>{save();if(!ledger.reviewer){$('notice').textContent='確認記録に残すお名前または呼び名を入力してください。';$('reviewer').focus();return}ledger.reviewed_at=new Date().toISOString();const blob=new Blob([JSON.stringify(ledger,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='human-review-'+all[0].split+'-'+ledger.corpus_sha256.slice(0,12)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('notice').textContent='確認記録を出力しました。元のケースファイルは変更していません。';save()});render();if(!storageAvailable)save();
</script></body></html>
